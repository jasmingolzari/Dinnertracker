schemaVersion: 2.1.0
metadata:
  name: dinnertracker #keep it 14 characters or less for the devcontainer name
components:
  - name: dinnertracker
    container:
      image: adrianstoica/it1901:latest
      memoryLimit: 3Gi
      endpoints:
        - exposure: public # needed for the devcontainer UI to be accessible from the browser via no VNC
          name: 01-desktop-ui
          protocol: https
          targetPort: 6080
          secure: true #required
          attributes:
            urlRewriteSupported: "true" #required
        - exposure: public
          name: 3000-tcp
          protocol: http
          targetPort: 3000 #typical nodejs port
        - exposure: public
          name: 5900-tcp
          protocol: http
          targetPort: 5900 #typical VNC port
        - exposure: public
          name: 5901-tcp
          protocol: http
          targetPort: 5901 #typical VNC port
        - exposure: public
          name: 8080-tcp
          protocol: http
          targetPort: 8080 #typical spring boot / tomcat port
        - exposure: public
          name: 5500-tcp
          protocol: http
          targetPort: 5500 #typical live server port

  