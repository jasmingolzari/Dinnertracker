name: Java CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ntnu-runners

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Maven
        uses: s4u/setup-maven@v1.13.0
        with:
          maven-version: '3.9.9'

      - name: Run Maven tests
        working-directory: dinnertracker
        run: mvn --batch-mode test

      - name: Verify project checks
        working-directory: dinnertracker
        run: mvn --batch-mode verify
