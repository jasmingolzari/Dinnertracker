name: Java CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ntnu-runners

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests
        working-directory: dinnertracker
        run: mvn --batch-mode verify
