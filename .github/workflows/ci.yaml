name: Java CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ntnu-runners

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Maven and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb curl
          MAVEN_VERSION=3.9.15
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin:$PATH"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
          mvn -version

      - name: Run Maven verification
        working-directory: dinnertracker
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" mvn --batch-mode verify
