name: Java CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ntnu-runners

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Maven and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y maven xvfb
          mvn -version

      - name: Run Maven verification
        working-directory: dinnertracker
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" mvn --batch-mode verify
